<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Admin SPPG TAMBAKREJO</title>

<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#111;
  padding:16px;
}

/* =========================
   LOGIN
========================= */

#loginBox{
  width:100%;
  max-width:360px;
  margin:70px auto;
  background:white;
  padding:24px;
  border-radius:24px;
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

#loginBox h2{
  text-align:center;
  margin-bottom:20px;
  font-size:24px;
}

#loginBox input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-bottom:14px;
  font-size:16px;
}

#loginBox button{
  width:100%;
}

/* =========================
   HEADER
========================= */

.top-header{
  margin-bottom:24px;
}

.top-header h1{
  font-size:28px;
  line-height:1.3;
  margin-bottom:6px;
}

.subtitle{
  color:#777;
  font-size:14px;
}

/* =========================
   CARD STATS
========================= */

.card-wrap{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;
  margin-bottom:24px;
}

.card{
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:0 4px 14px rgba(0,0,0,0.06);
}

.card h2{
  font-size:32px;
  margin-bottom:6px;
}

.card p{
  color:#666;
  font-size:14px;
}

/* =========================
   FILTER
========================= */

.filter-box{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:22px;
}

.filter-box select,
.filter-box button{
  flex:1;
  min-width:140px;
}

select,
button{
  padding:13px;
  border-radius:14px;
  border:none;
  font-size:15px;
}

select{
  background:white;
  border:1px solid #ddd;
}

button{
  background:#111;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

/* =========================
   ABSENSI CARD
========================= */

.mobile-card-wrap{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.absen-card{
  background:white;
  border-radius:24px;
  padding:18px;
  box-shadow:0 4px 14px rgba(0,0,0,0.06);
}

.card-top{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}

.card-photo{
  width:68px;
  height:68px;
  border-radius:20px;
  object-fit:cover;
  background:#eee;
  flex-shrink:0;
}

.card-user{
  flex:1;
  min-width:0;
}

.card-user h3{
  font-size:17px;
  margin-bottom:4px;
}

.card-user p{
  font-size:13px;
  color:#777;
}

.card-status{
  margin-top:10px;
}

.status-aktif{
  background:#e8f5e9;
  color:#2e7d32;
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
  display:inline-block;
}

.status-pulang{
  background:#ffebee;
  color:#c62828;
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
  display:inline-block;
}

.card-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.info-box{
  background:#f7f7f7;
  padding:14px;
  border-radius:18px;
}

.info-label{
  font-size:12px;
  color:#888;
  margin-bottom:6px;
}

.info-value{
  font-size:14px;
  font-weight:600;
  word-break:break-word;
}

.map-btn{
  display:block;
  width:100%;
  margin-top:16px;
  text-align:center;
  background:#111;
  color:white;
  text-decoration:none;
  padding:13px;
  border-radius:16px;
  font-size:14px;
  font-weight:bold;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;
  margin-top:26px;
  color:#999;
  font-size:12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

  body{
    padding:12px;
  }

  .top-header h1{
    font-size:22px;
  }

  .card-wrap{
    grid-template-columns:1fr;
  }

  .filter-box{
    flex-direction:column;
  }

  .filter-box select,
  .filter-box button{
    width:100%;
  }

}

@media(max-width:480px){

  .card-grid{
    grid-template-columns:1fr;
  }

  .card-photo{
    width:60px;
    height:60px;
  }

  .card{
    padding:18px;
  }

  .card h2{
    font-size:28px;
  }

}

</style>

</head>
<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginBox">

<h2>
Login Admin
</h2>

<input
type="password"
id="adminPin"
placeholder="Masukkan PIN Admin">

<button onclick="loginAdmin()">
Masuk Dashboard
</button>

</div>

<!-- =========================
     DASHBOARD
========================= -->

<div id="dashboardBox" style="display:none;">

<div class="top-header">

<h1>
Dashboard Admin SPPG TAMBAKREJO
</h1>

<div class="subtitle">
Monitoring Absensi Relawan
</div>

</div>

<!-- =========================
     STATS
========================= -->

<div class="card-wrap">

<div class="card">
<h2 id="totalHadir">0</h2>
<p>Total Hadir</p>
</div>

<div class="card">
<h2 id="belumPulang">0</h2>
<p>Belum Pulang</p>
</div>

<div class="card">
<h2 id="totalDivisi">0</h2>
<p>Total Divisi Aktif</p>
</div>

</div>

<!-- =========================
     FILTER
========================= -->

<div class="filter-box">

<select id="filterShift" onchange="loadData()">
<option value="">Semua Shift</option>
</select>

<select id="filterDivisi" onchange="loadData()">
<option value="">Semua Divisi</option>
</select>

<button onclick="loadData()">
Refresh
</button>

<button onclick="exportExcel()">
Export Excel
</button>

</div>

<!-- =========================
     CARD LIST
========================= -->

<div id="cardContainer" class="mobile-card-wrap">
</div>

<!-- =========================
     FOOTER
========================= -->

<div class="footer">
© 2026 F_
</div>

</div>

<script>

// ======================
// URL APPS SCRIPT
// ======================

const url =
"https://script.google.com/macros/s/AKfycbzJ2x2vUT9MONWSLnGMKiZI0voXR-gwehFT9-5gE3b9abYhI55veyYV6iTx0W9MrDqp/exec";

// ======================
// PIN ADMIN
// ======================

const ADMIN_PIN = "666";

// ======================
// LOGIN
// ======================

function loginAdmin(){

  const pin =
  document
  .getElementById("adminPin")
  .value;

  if(pin === ADMIN_PIN){

    document
    .getElementById("loginBox")
    .style.display = "none";

    document
    .getElementById("dashboardBox")
    .style.display = "block";

    loadData();

  }

  else{

    alert("PIN Admin Salah");

  }

}

// ======================
// LOAD DATA
// ======================

async function loadData(){

  try{

    const response =
    await fetch(
      url + "?dashboard=1"
    );

    const data =
    await response.json();

    const container =
    document.getElementById(
      "cardContainer"
    );

    container.innerHTML = "";

    let belumPulang = 0;

    const divisiSet =
    new Set();

    const shiftSet =
    new Set();

    data.forEach(item => {

      divisiSet.add(
        item.divisi
      );

      shiftSet.add(
        item.shift
      );

      if(item.pulang === ""){

        belumPulang++;

      }

    });

    document
    .getElementById("totalHadir")
    .innerHTML = data.length;

    document
    .getElementById("belumPulang")
    .innerHTML = belumPulang;

    document
    .getElementById("totalDivisi")
    .innerHTML = divisiSet.size;

    isiFilterShift(
      [...shiftSet]
    );

    isiFilterDivisi(
      [...divisiSet]
    );

    const filterShift =
    document
    .getElementById(
      "filterShift"
    )
    .value;

    const filterDivisi =
    document
    .getElementById(
      "filterDivisi"
    )
    .value;

    const filtered =
    data.filter(item => {

      const cocokShift =
      !filterShift ||
      item.shift === filterShift;

      const cocokDivisi =
      !filterDivisi ||
      item.divisi === filterDivisi;

      return (
        cocokShift &&
        cocokDivisi
      );

    });

    filtered.forEach(item => {

      const statusHTML =

      item.pulang === ""

      ?

      '<span class="status-aktif">🟢 Sedang Bertugas</span>'

      :

      '<span class="status-pulang">🔴 Sudah Pulang</span>';

      const foto = item.foto
      ? item.foto
      : "https://via.placeholder.com/100";

      const card =
      document.createElement("div");

      card.className =
      "absen-card";

      card.innerHTML = `

      <div class="card-top">

        <img
        src="${foto}"
        class="card-photo">

        <div class="card-user">

          <h3>${item.nama}</h3>

          <p>
          ${item.divisi}
          •
          ${item.shift}
          </p>

          <div class="card-status">
          ${statusHTML}
          </div>

        </div>

      </div>

      <div class="card-grid">

        <div class="info-box">

          <div class="info-label">
          Jam Masuk
          </div>

          <div class="info-value">
          ${formatJam(item.masuk)}
          </div>

        </div>

        <div class="info-box">

          <div class="info-label">
          Jam Pulang
          </div>

          <div class="info-value">
          ${item.pulang
          ? formatJam(item.pulang)
          : "-"}
          </div>

        </div>

        <div class="info-box">

          <div class="info-label">
          Total Kerja
          </div>

          <div class="info-value">
          ${hitungDurasi(
            item.masuk,
            item.pulang
          )}
          </div>

        </div>

        <div class="info-box">

          <div class="info-label">
          Lokasi
          </div>

          <div class="info-value">
          Tersimpan
          </div>

        </div>

      </div>

      <a
      href="https://maps.google.com/?q=${item.lokasi}"
      target="_blank"
      class="map-btn">

      📍 Lihat Lokasi

      </a>

      `;

      container.appendChild(card);

    });

  }

  catch(error){

    alert(
      "Gagal load dashboard"
    );

  }

}

// ======================
// FILTER SHIFT
// ======================

function isiFilterShift(data){

  const select =
  document.getElementById(
    "filterShift"
  );

  if(select.options.length > 1){
    return;
  }

  data.forEach(item => {

    const option =
    document.createElement(
      "option"
    );

    option.value = item;
    option.text = item;

    select.appendChild(option);

  });

}

// ======================
// FILTER DIVISI
// ======================

function isiFilterDivisi(data){

  const select =
  document.getElementById(
    "filterDivisi"
  );

  if(select.options.length > 1){
    return;
  }

  data.forEach(item => {

    const option =
    document.createElement(
      "option"
    );

    option.value = item;
    option.text = item;

    select.appendChild(option);

  });

}

// ======================
// FORMAT JAM
// ======================

function formatJam(value){

  if(!value){
    return "-";
  }

  const date =
  new Date(value);

  if(isNaN(date)){
    return value;
  }

  return date.toLocaleTimeString(

    "id-ID",

    {
      hour:"2-digit",
      minute:"2-digit"
    }

  );

}

// ======================
// HITUNG DURASI
// ======================

function hitungDurasi(
  masuk,
  pulang
){

  if(!masuk || !pulang){
    return "-";
  }

  const jamMasuk =
  new Date(masuk);

  const jamPulang =
  new Date(pulang);

  if(
    isNaN(jamMasuk) ||
    isNaN(jamPulang)
  ){
    return "-";
  }

  let selisih =
  (jamPulang - jamMasuk)
  / 1000;

  const jam =
  Math.floor(
    selisih / 3600
  );

  const menit =
  Math.floor(
    (selisih % 3600)
    / 60
  );

  return `
  ${jam}j ${menit}m
  `;

}

// ======================
// EXPORT EXCEL
// ======================

function exportExcel(){

  alert(
    "Gunakan versi tabel untuk export excel."
  );

}

// ======================
// AUTO REFRESH
// ======================

setInterval(
  loadData,
  30000
);

</script>

</body>
</html>
